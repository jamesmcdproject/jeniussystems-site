<!DOCTYPE html>
<!-- Build-only: rendered to favicon.png (512x512) and apple-touch-icon.png (180x180)
     via headless Chrome screenshot. Paper tile, OpenDyslexic j, baked round corners. -->
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Regular.otf") format("opentype");
  }
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; background: transparent; overflow: hidden; }
  .tile {
    width: 512px; height: 512px;
    background: #fbfaf8;
    border-radius: 104px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .j {
    font-family: "OpenDyslexic";
    font-size: 380px;
    color: #23231f;
    line-height: 1;
    margin-top: -70px; /* optical centering — the j's descender pulls mass down */
  }
  .dot {
    position: absolute; right: 96px; top: 96px;
    width: 56px; height: 56px; border-radius: 999px;
    background: #0b7a52;
  }
</style>
</head>
<body>
  <div class="tile"><span class="j">j</span><span class="dot"></span></div>
</body>
</html>
