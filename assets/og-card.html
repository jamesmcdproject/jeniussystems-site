<!DOCTYPE html>
<!-- Build-only: rendered to assets/og.png at 1200x630 via headless Chrome screenshot.
     Not linked from any page. Uses the repo's self-hosted OpenDyslexic. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Regular.otf") format("opentype");
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: "OpenDyslexic";
    src: url("fonts/OpenDyslexic-Italic.otf") format("opentype");
    font-weight: 400; font-style: italic;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fbfaf8;
    color: #23231f;
    font-family: "OpenDyslexic", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    position: relative;
  }
  .rule-t { position: absolute; top: 84px; left: 96px; right: 96px; height: 1px; background: rgba(35,35,31,0.16); }
  .rule-b { position: absolute; bottom: 84px; left: 96px; right: 96px; height: 1px; background: rgba(35,35,31,0.16); }
  h1 { font-weight: 400; font-size: 84px; letter-spacing: -0.01em; }
  .tag { font-style: italic; color: #66665e; font-size: 30px; line-height: 1.6; margin-top: 30px; max-width: 900px; }
  .meta { position: absolute; bottom: 40px; left: 96px; font-family: ui-monospace, Menlo, monospace; font-size: 15px; letter-spacing: 0.22em; color: #8f8f85; display: flex; align-items: center; gap: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; background: #0b7a52; display: inline-block; }
</style>
</head>
<body>
  <div class="rule-t"></div>
  <h1>jeniussystems.ai</h1>
  <p class="tag">self-exploration, knowledge-gathering, and a little fun —
    showing what we've built better than I can explain in person.</p>
  <div class="rule-b"></div>
  <p class="meta"><span class="dot"></span>LIVE GAME&nbsp;&nbsp;·&nbsp;&nbsp;FLEET SANDBOX&nbsp;&nbsp;·&nbsp;&nbsp;PRIVATE PILOT</p>
</body>
</html>
